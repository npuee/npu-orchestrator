# ==============================================================================
# NPU Orchestrator - Appliance Configuration
# ==============================================================================
# This file controls the behaviour of your orchestrator.
# It is safe to edit and is never transmitted anywhere.
#
# IMPORTANT: Credentials (passwords, API tokens) belong in .env, not here.
# This file only contains non-secret topology and default settings.
#
# After editing this file, restart the container:
#   docker compose restart
# ==============================================================================

version: "1.0"

# ── NetBox Default Assignments ─────────────────────────────────────────────────
# These IDs are used when provisioning a new VM or container.
# They are automatically populated when you run ./install.sh
# You can find IDs in NetBox by navigating to the object and checking the URL.
defaults:
  tenant_id: 1       # NetBox Tenant ID  (e.g. /tenancy/tenants/6/)
  site_id: 1         # NetBox Site ID    (e.g. /dcim/sites/2/)
  cluster_id: 1      # NetBox Cluster ID (e.g. /virtualization/clusters/2/)
  role_vm_id: 16     # Role ID for Virtual Machines
  role_lxc_id: 15    # Role ID for LXC Containers
  storage: "local-zfs"  # Proxmox storage pool name (fallback if not set per-cluster)
  bridge: "vmbr0"         # Proxmox network bridge name (fallback if not set per-cluster)

# ── Hardware Fallbacks ────────────────────────────────────────────────────────
# Emergency default specs if a VM is created without a VM Type and blank sliders.
# Note: You can create & customize VM sizing profiles directly in NetBox UI:
#   NetBox → Virtualization → VM Types (e.g. Small: 1C/1G, Standard: 2C/4G, etc.)
fallbacks:
  cores: 2                  # Default vCPU cores
  memory_mb: 2048           # Default RAM in MB (2048 = 2GB)
  disk_gb: 20               # Default root disk size in GB

# ── Proxmox Template Settings ─────────────────────────────────────────────────
# Controls how the orchestrator selects templates when cloning VMs.
templates:
  enabled: true                     # Auto-sync Proxmox templates to NetBox Platforms
  sync_interval_minutes: 60         # Frequency of template reconciliation in minutes
  linux_vmid_prefix: "90"           # Linux templates live in VMID range 9000-9099
  windows_vmid_prefix: "92"         # Windows templates live in VMID range 9200-9299
  default_windows_password: "P@ssw0rdInitial!"  # Initial Administrator password for Windows VMs

# ── Traefik Ingress Synchronization ───────────────────────────────────────────
# The orchestrator can scan your Traefik reverse proxy instances and register
# all your web services (domain names, URLs, SSO tags) in NetBox automatically.
#
# Two connection types are supported:
#   docker - connects to the local Docker socket to read Traefik config files
#   api    - connects to a remote Traefik instance via its REST API
#
# Add one entry per Traefik instance.
# - Use netbox_vm_id for Traefik running on a Virtual Machine (e.g. Cloud/OCI VM)
# - Use netbox_device_id for Traefik running directly on bare metal (e.g. Proxmox host)
# This links your web routes to the "Application Services" list on that host in NetBox.
traefik:
  enabled: true
  sync_interval_minutes: 15
  service_tag: "traefik"            # Single NetBox tag applied to discovered routes (e.g. "traefik" or "traefik-route")

  # Substrings or middleware names used to detect IP whitelist and SSO protection
  middleware_patterns:
    ip_whitelist:
      - "whitelist"
      - "allowlist"
      - "private-ip"
      - "local-only"
    sso:
      - "sso"
      - "forward-auth"
      - "authelia"
      - "authentik"
      - "oauth"

  # NetBox custom field name mapping for ipam.service objects
  custom_fields:
    public_url: "public_url"
    fqdn: "fqdn"
    sso_protected: "sso_protected"
    ip_whitelist: "ip_whitelist"
    middlewares: "middlewares"

  instances:
    - name: "traefik-main"          # Local Docker Traefik on VM
      netbox_vm_id: 10              # NetBox VM ID (virtualization.virtualmachine)
      type: "docker"                # Use "docker" if Traefik runs on this host
      path: "/etc/traefik"          # Traefik config directory on disk
      conf_dir: "/etc/traefik/conf" # Traefik dynamic config directory
    - name: "traefik-remote"        # Remote Traefik instance running on bare metal
      netbox_device_id: 5           # NetBox Device ID (dcim.device)
      type: "api"                   # Use "api" for remote instances
      api_url: "http://192.168.1.50:8080"  # Traefik API address

# ── Proxmox Telemetry & Metrics Synchronization ──────────────────────────────
# Periodically queries Proxmox VE for live CPU, RAM, Disk, and Uptime metrics
# and updates the corresponding custom fields and power states in NetBox.
telemetry:
  enabled: true
  sync_interval_minutes: 15     # Interval for polling Proxmox telemetry

# ── DNS Management ────────────────────────────────────────────────────────────
# When a VM is created, the orchestrator can automatically create DNS records
# in NetBox DNS (requires the netbox-dns plugin to be installed in NetBox).
#
# Set auto_register_a and auto_register_ptr to false if you don't use NetBox DNS.
dns:
  default_zone: "example.internal"  # Your internal DNS domain (e.g. "home.lab", "company.local", "corp.net")
  auto_register_a: true             # Create forward DNS records (hostname → IP)
  auto_register_ptr: true           # Create reverse DNS records (IP → hostname)

# ── Uptime Kuma Monitoring ───────────────────────────────────────────────────
# Synchronizes NetBox device inventory with Uptime Kuma, creating ICMP Ping
# monitors for all physical infrastructure and auto-grouping by Site.
uptime_kuma:
  enabled: true
  public_url: "https://kuma.npu.ee"  # Public dashboard URL used for NetBox 1-click links
  sync_interval_minutes: 30     # Frequency of NetBox -> Uptime Kuma reconciliation in minutes
  sync_on_startup: true         # Run reconciliation immediately on container boot
  enable_default_notifications: true  # Auto-attach Uptime Kuma default notification channels
  exclude_tags:                 # NetBox tags that exclude devices from monitoring (auto-deleted if tagged)
    - "no-monitor"
  group_by_site: true           # Group monitors into Site folders (e.g. Lohusuu, Hulja, Oracle)
  ping_interval: 60             # Heartbeat check interval in seconds
  ping_retry_interval: 60       # Retry interval when a check fails
  max_retries: 3                # Failures before marking monitor DOWN

# ── Database & State Retention ────────────────────────────────────────────────
# Controls the automatic maintenance of the SQLite jobs and logs history.
database:
  retention_days: 30            # Days to retain completed/failed jobs and logs
  prune_interval_hours: 24      # How often to run historical job pruning (hours)
